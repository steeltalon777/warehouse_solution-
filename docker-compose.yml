name: warehouse-solution

services:
  postgres:
    image: postgres:15-alpine
    container_name: warehouse_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse_user} -d ${POSTGRES_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  syncserver:
    build: ./SyncServer
    container_name: warehouse_syncserver
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://warehouse_user:warehouse_pass@postgres:5432/warehouse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
    volumes:
      - ./SyncServer:/app
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  warehouse_web:
    build:
      # Root context so the image can COPY QuartermasterDocumentEngine/
      # (ADR-0032 D7, TZ §9.1). Root .dockerignore keeps the context lean.
      context: .
      dockerfile: Warehouse_web/Dockerfile
    container_name: warehouse_web
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DJANGO_ENV: ${DJANGO_ENV:-development}
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-change-in-production}
      DEBUG: ${DEBUG:-True}
      # E2E-base URL использует network alias `warehouse-web` (hyphen), потому что
      # Django rejects HTTP `Host:` заголовки с underscore в hostname по RFC 1034/1035
      # (см. ALLOWED_HOSTS-проверку в django.http.request.validate_host).
      # `warehouse_web` (underscore) оставлен в ALLOWED_HOSTS только для legacy
      # хост-запросов; сам Playwright ходит через `warehouse-web`.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,warehouse_web,warehouse-web}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-warehouse}
      DB_USER: ${DB_USER:-warehouse_user}
      DB_PASSWORD: ${DB_PASSWORD:-warehouse_pass}
      DB_HOST: postgres
      DB_PORT: 5432
      SYNC_SERVER_URL: ${SYNC_SERVER_URL:-http://syncserver:8000/api/v1}
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
      FRONTEND_DEV_SERVER_URL: ${FRONTEND_DEV_SERVER_URL:-http://angular:4200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
    volumes:
      - ./Warehouse_web:/app
    depends_on:
      postgres:
        condition: service_healthy
      syncserver:
        condition: service_started
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f --max-time 5 http://localhost:8001/healthz/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      default:
        aliases:
          - warehouse-web

  angular:
    build: ./Warehouse_frontend
    container_name: warehouse_angular
    restart: unless-stopped
    ports:
      - "4200:4200"
    env_file:
      - .env
    volumes:
      - ./Warehouse_frontend:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      warehouse_web:
        condition: service_started
      syncserver:
        condition: service_started
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm start -- --host 0.0.0.0 --port 4200"

  playwright:
    build:
      context: ./Warehouse_frontend
      dockerfile: Dockerfile.playwright
    image: warehouse-solution/playwright:local
    container_name: warehouse_playwright
    working_dir: /app
    volumes:
      - ./Warehouse_frontend:/app
      - ./Warehouse_frontend/node_modules:/app/node_modules:ro
    environment:
      - CI=${CI:-true}
      - E2E_BASE_URL=http://warehouse-web:8001
      - E2E_SYNC_HEALTH_URL=http://syncserver:8000/api/v1/health
      - E2E_USERNAME_ROOT=${E2E_USERNAME_ROOT:-admin}
      - E2E_PASSWORD_ROOT=${E2E_PASSWORD_ROOT:-admin123}
      - E2E_USERNAME_SPA=${E2E_USERNAME_SPA:-aksha}
      - E2E_PASSWORD_SPA=${E2E_PASSWORD_SPA:-089786}
      - E2E_USERNAME_CHIEF=${E2E_USERNAME_CHIEF:-chief_storagekeeper}
      - E2E_PASSWORD_CHIEF=${E2E_PASSWORD_CHIEF:-089786}
      - E2E_USERNAME_BUH_OBSERVER=${E2E_USERNAME_BUH_OBSERVER:-buh_observer}
      - E2E_PASSWORD_BUH_OBSERVER=${E2E_PASSWORD_BUH_OBSERVER:-089786}
      - E2E_USERNAME_STOREKEEPER=${E2E_USERNAME_STOREKEEPER:-aksha}
      - E2E_PASSWORD_STOREKEEPER=${E2E_PASSWORD_STOREKEEPER:-089786}
    depends_on:
      warehouse_web:
        condition: service_healthy
      syncserver:
        condition: service_started
    command: echo "Playwright image ready. Use 'make test-e2e' to run tests."
    networks:
      - default

volumes:
  postgres_data:
