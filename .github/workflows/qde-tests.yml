name: QDE Tests

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'QuartermasterDocumentEngine/**'
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'QuartermasterDocumentEngine/**'
  workflow_dispatch:

jobs:
  qde-unit:
    name: QDE unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: QuartermasterDocumentEngine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: QuartermasterDocumentEngine/pyproject.toml

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Run unit tests (includes ADR-0031 architecture boundary guard)
        run: pytest tests/unit -q

  qde-integration:
    name: QDE integration + component (pinned Typst)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: QuartermasterDocumentEngine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: QuartermasterDocumentEngine/pyproject.toml

      - name: Install package
        run: pip install -e '.[dev,spike]'

      # Build-time fetch only; pinned version + sha256 verified (ADR-0030 D1).
      # Runtime download is forbidden by ADR-0032 D7; CI fetch is build-time.
      - name: Fetch pinned Typst binary (sha256 verified)
        run: python scripts/fetch_typst.py

      - name: Run integration + component tests
        run: pytest tests/integration tests/component -q

  qde-golden:
    name: QDE golden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: QuartermasterDocumentEngine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: QuartermasterDocumentEngine/pyproject.toml

      - name: Install package
        run: pip install -e '.[dev,spike]'

      - name: Fetch pinned Typst binary (sha256 verified)
        run: python scripts/fetch_typst.py

      - name: Run golden regression
        run: pytest -m golden -q
